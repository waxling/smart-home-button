packages:
  smart_home_button:
    url: https://github.com/waxling/smart-home-button
    ref: main
    refresh: 1d
    files:
      - path: packages/haos-espbuilder.yaml
        vars:
          smart_home_button_ref: main
          smart_home_button_refresh: 1d
          device_name: m5stack-dialv1
          friendly_name: M5Stack Dial
          weather_entity: weather.your_location
          climate_entity: climate.your_ac
          music_player_entity: media_player.your_player
          wifi_ssid: !secret wifi_ssid
          wifi_password: !secret wifi_password
          ap_ssid: !secret ap_ssid
          ap_password: !secret ap_password
          api_encryption_key: !secret api_encryption_key
          ota_password: !secret ota_password
          time_timezone: Australia/Sydney
          clock_time_format: "%H:%M"
          clock_date_format: "%a %d/%m"
          home_temperature_entity: sensor.your_temperature
          home_temperature_format: "%.0f°"
          home_humidity_entity: sensor.your_humidity
          home_humidity_format: "%.0f%%"
          home_aqi_entity: sensor.your_aqi
          home_aqi_format: "%.0f"
          home_pressure_entity: sensor.your_pressure
          home_pressure_format: "%.0fhPa"
          home_wind_entity: sensor.your_wind_speed
          home_wind_format: "%.0fkm/h"
